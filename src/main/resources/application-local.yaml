server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hospital_db}
    username: ${DB_UNAME:postgres}
    password: ${DB_PSWD:postgres}

  flyway:
    locations: ${MIGRATION_LOCATION:classpath:db/migration}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TMEOUT:2000}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
