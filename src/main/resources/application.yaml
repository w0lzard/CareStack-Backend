server:
  port: ${port}

spring:
  application:
    name: carestack

  datasource:
    url: ${db_url}
    username: ${db_uname}
    password: ${db_pswd}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway now owns the schema - Hibernate only checks entities match it,
      # it never creates or alters tables itself.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: ${migration_location}
    baseline-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
    consumer:
      group-id: carestack
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ryuken.carestack.billing.event"
    listener:
      ack-mode: manual

hospital:
  scheduling:
    appointment-reminder-cron: "0 0 7 * * *"       # every day at 7 AM
    inventory-reconciliation-cron: "0 30 1 * * *"  # every day at 1:30 AM
  cache:
    default-ttl-minutes: 30
  idempotency:
    ttl-hours: 24

logging:
  level:
    root: INFO
    com.ryuken.carestack: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
